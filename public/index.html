<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="学生手册考试题库在线检索，支持多关键词组合搜索，共 3357 条题目。">
<title>学生手册考试题库检索</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    min-height:100vh;
    background:linear-gradient(135deg,#e8f0fc,#f0f7ff);
    font-family:"Microsoft Yahei",system-ui,sans-serif;
    padding:30px 16px;
}
.container{max-width:1020px;margin:0 auto;}
.card{
    background:#fff;border-radius:14px;
    box-shadow:0 4px 16px rgba(34,102,170,0.12);
    padding:26px 30px;
}
h1{text-align:center;color:#1f4e80;font-size:26px;margin-bottom:8px;}
.sub{text-align:center;color:#5c7699;font-size:14px;margin-bottom:18px;}
.desc-tip{
    background:#edf4fc;border-left:4px solid #2368aa;
    padding:10px 14px;border-radius:8px;font-size:14px;
    color:#33547c;margin-bottom:16px;line-height:1.6;
}
.search-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.inp{
    flex:1;min-width:240px;padding:13px 15px;font-size:16px;
    border:1px solid #cbd8e8;border-radius:9px;outline:none;
}
.inp:focus{border-color:#2368aa;box-shadow:0 0 0 3px rgba(35,104,170,0.14);}
.btn{padding:13px 22px;border:none;border-radius:9px;font-size:16px;cursor:pointer;}
.btn-blue{background:#2368aa;color:#fff;}
.btn-blue:hover{background:#1a548c;}
.btn-gray{background:#e2eaf4;color:#2c4b70;}
.btn-gray:hover{background:#cbd8e8;}
.stat{font-size:14px;color:#7a8fa8;margin-bottom:8px;}
.result-box{min-height:120px;line-height:1.8;font-size:15.5px;padding:6px 2px;}
.hit{background:#fff280;padding:0 2px;border-radius:3px;}
.item{margin-bottom:16px;padding-bottom:12px;border-bottom:1px dashed #d4e0ee;}
footer{text-align:center;margin-top:16px;font-size:13px;color:#647c9c;}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>📋学生手册考试题库</h1>
    <div class="sub">本地离线检索 · 题库共 <b>3357</b> 条</div>
    <div class="desc-tip">输入题目中的关键词，例如：奖学金、旷课、处分、助学贷款；支持回车搜索</div>
    <div class="search-row">
      <input class="inp" id="inp" placeholder="输入关键词检索题库……">
      <button class="btn btn-blue" id="btnSearch">🔍搜索</button>
      <button class="btn btn-gray" id="btnClear">🗑️清空</button>
    </div>
    <div class="stat" id="stat">全部题库已加载，等待检索</div>
    <div class="result-box" id="res">请输入关键词开始检索……</div>
  </div>
  <footer>题库来源：学生手册考试题库promaxultra.docx</footer>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
